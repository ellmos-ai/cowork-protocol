      .path-copy { font: 500 17px Inter, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #5d5047; }
      .mode-copy { font: 500 18px Inter, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #4c4139; }
      .chip { font: 800 15px ui-monospace, "SFMono-Regular", Consolas, monospace; letter-spacing: 0.8px; }
      .footnote { font: 500 17px Inter, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #6b5d53; }
      .on-art { fill: #241c15; }
      .on-art-soft { fill: #4a3b32; }
