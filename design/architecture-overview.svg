<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" role="img" aria-labelledby="title description">
  <title id="title">Cowork Protocol architecture overview</title>
  <desc id="description">Read top to bottom. Each partner answers three questions, present, working on what, and in which role, and the resulting work mode names who may click; a model executes only inside a grant or lease. The human works through one interchangeable surface, rendered by an embedded panel, an extension side panel or the Desktop Companion. One versioned Session Authority owns the leases, and one bounded context and serialized gateway feed the single active model seat, which resolves to a scripted demo helper, a direct endpoint, a page host, the connected Companion, or nothing. The provider-neutral Protocol Core then takes the strongest connector the page actually offers: native Cowork, an existing WebMCP catalog behind a bounded bridge, or a browser relay that registers the Cowork tools over WebMCP itself, with a profile-filtered Open Compute fallback in the Desktop Companion. Every path ends the same way, at a visible offer, a real human click and an observed verification.</desc>

