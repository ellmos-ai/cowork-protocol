<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" role="img" aria-labelledby="title description">
  <title id="title">Cowork Protocol architecture overview</title>
  <desc id="description">Read top to bottom. Each partner answers three questions, present, working on what, and in which role, and the resulting work mode names who may click; a model executes only inside a grant or lease. The human works through one interchangeable surface, rendered by an embedded panel, an extension side panel or the Desktop Companion. One versioned Session Authority owns the leases, and one bounded context and serialized gateway feed the single active model seat, which resolves to a scripted demo helper, a direct endpoint, a page host, the connected Companion, or nothing. The provider-neutral Protocol Core then takes the strongest connector the page actually offers: native Cowork, an existing WebMCP catalog behind a bounded bridge, or a browser relay that registers the Cowork tools over WebMCP itself, with a profile-filtered Open Compute fallback in the Desktop Companion. Every path ends the same way, at a visible offer, a real human click and an observed verification.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8ef"/>
      <stop offset="0.48" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#eafbf7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#241c15" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#241c15"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0a7a72"/>
    </marker>
    <style>
      .title { font: 800 60px Inter, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #241c15; letter-spacing: -2px; }
      .subtitle { font: 400 26px Inter, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #584c43; }
      .eyebrow { font: 800 16px ui-monospace, "SFMono-Regular", Consolas, monospace; letter-spacing: 2.2px; fill: #0a7a72; }
      .card-title { font: 750 26px Inter, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #241c15; }
      .card-copy { font: 400 18px Inter, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #5d5047; }
      .path-title { font: 800 26px Inter, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #241c15; }
      .path-copy { font: 500 17px Inter, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #5d5047; }
      .mode-copy { font: 500 18px Inter, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #4c4139; }
      .chip { font: 800 15px ui-monospace, "SFMono-Regular", Consolas, monospace; letter-spacing: 0.8px; }
      .footnote { font: 500 17px Inter, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #6b5d53; }
    </style>
  </defs>

  <rect width="1800" height="1050" rx="34" fill="url(#background)"/>
  <circle cx="1660" cy="90" r="215" fill="#0a7a72" opacity="0.07"/>
  <circle cx="120" cy="990" r="255" fill="#ff604a" opacity="0.06"/>

  <text x="70" y="66" class="eyebrow">WEBMCP COLLABORATION ARCHITECTURE</text>
  <text x="70" y="122" class="title">Cowork Protocol</text>
  <text x="70" y="160" class="subtitle">One protocol · one human surface · three hosts.</text>

  <!-- Work mode band -->
  <rect x="70" y="190" width="1660" height="84" rx="22" fill="#fffdf6" stroke="#d3c2ab" stroke-width="2"/>
  <text x="102" y="240" class="eyebrow">WORK MODE MATRIX</text>
  <path d="M380 214 V250" stroke="#ddcfbf" stroke-width="2"/>
  <text x="412" y="240" class="mode-copy">Present? · Working on? · Role?</text>
  <path d="M800 214 V250" stroke="#ddcfbf" stroke-width="2"/>
  <text x="832" y="240" class="mode-copy">Sparring · Doubling · solo work</text>
  <path d="M1230 214 V250" stroke="#ddcfbf" stroke-width="2"/>
  <text x="1262" y="240" class="mode-copy">model executes only inside a grant or lease</text>

  <!-- Session row -->
  <g filter="url(#shadow)">
    <rect x="70" y="314" width="382" height="210" rx="26" fill="#fffefb" stroke="#decfbf" stroke-width="2"/>
    <rect x="496" y="314" width="382" height="210" rx="26" fill="#fffefb" stroke="#0a7a72" stroke-width="4"/>
    <rect x="922" y="314" width="382" height="210" rx="26" fill="#fffefb" stroke="#e5be6b" stroke-width="4"/>
    <rect x="1348" y="314" width="382" height="210" rx="26" fill="#fffefb" stroke="#ff604a" stroke-width="3"/>
  </g>

  <text x="98" y="354" class="eyebrow">HUMAN</text>
  <text x="98" y="400" class="card-title">The human</text>
  <text x="98" y="436" class="card-copy">focus · speech · selection</text>
  <text x="98" y="464" class="card-copy">the trusted click</text>

  <text x="524" y="354" class="eyebrow">ONE HUMAN SURFACE</text>
  <text x="524" y="400" class="card-title">Interchangeable UI</text>
  <text x="524" y="436" class="card-copy">embedded panel</text>
  <text x="524" y="464" class="card-copy">extension side panel</text>
  <text x="524" y="492" class="card-copy">Desktop Companion</text>

  <text x="950" y="354" class="eyebrow">ONE VERSIONED SESSION</text>
  <text x="950" y="400" class="card-title">Session Authority</text>
  <text x="950" y="436" class="card-copy">revision · surface leases</text>
  <text x="950" y="464" class="card-copy">presence · modes · journal</text>

  <text x="1376" y="354" class="eyebrow">ONE ACTIVE SEAT</text>
  <text x="1376" y="400" class="card-title">Model seat</text>
  <text x="1376" y="436" class="card-copy">Context + gateway</text>
  <text x="1376" y="464" class="card-copy">demo · direct · none</text>
  <text x="1376" y="492" class="card-copy">page host · companion</text>

  <path d="M452 419 H496" stroke="#241c15" stroke-width="3" marker-end="url(#arrow-dark)"/>
  <path d="M878 419 H922" stroke="#241c15" stroke-width="3" marker-end="url(#arrow-dark)"/>
  <path d="M1304 419 H1348" stroke="#241c15" stroke-width="3" marker-end="url(#arrow-dark)"/>

  <!-- Protocol core -->
  <path d="M1113 524 V544 H900 V564" fill="none" stroke="#0a7a72" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
  <rect x="620" y="564" width="560" height="52" rx="26" fill="#0a7a72"/>
  <text x="900" y="597" text-anchor="middle" class="chip" fill="#ffffff">PROTOCOL CORE · STRONGEST AVAILABLE CONNECTOR</text>

  <!-- Three connector paths -->
  <g filter="url(#shadow)">
    <rect x="70" y="656" width="524" height="274" rx="26" fill="#f2fbf8" stroke="#0a7a72" stroke-width="3"/>
    <rect x="638" y="656" width="524" height="274" rx="26" fill="#fffbef" stroke="#e5be6b" stroke-width="3"/>
    <rect x="1206" y="656" width="524" height="274" rx="26" fill="#fff5f2" stroke="#ff604a" stroke-width="3"/>
  </g>

  <text x="102" y="710" class="path-title">1 · Native Cowork</text>
  <text x="102" y="760" class="path-copy">the page ships the protocol</text>
  <text x="102" y="793" class="path-copy">nine tools registered by the page</text>
  <text x="102" y="826" class="path-copy">stable targets · verified actions</text>
  <text x="102" y="859" class="path-copy">FormBuilder Studio + sample form</text>
  <text x="102" y="892" class="path-copy">strongest guarantees</text>

  <text x="670" y="710" class="path-title">2 · Existing WebMCP</text>
  <text x="670" y="760" class="path-copy">the page has its own tools</text>
  <text x="670" y="793" class="path-copy">a bounded bridge on top</text>
  <text x="670" y="826" class="path-copy">read results capped</text>
  <text x="670" y="859" class="path-copy">mutations stay offer-only</text>
  <text x="670" y="892" class="path-copy">degraded, never hidden</text>

  <text x="1238" y="710" class="path-title">3 · No WebMCP</text>
  <text x="1238" y="760" class="path-copy">Browser relay + Side Panel</text>
  <text x="1238" y="793" class="path-copy">350 → 1,200 → 400×400 relay lens</text>
  <text x="1238" y="826" class="path-copy">semantic first · bounded visual escalation</text>
  <text x="1238" y="859" class="path-copy">Cowork tools registered over WebMCP</text>
  <text x="1238" y="892" class="path-copy">Desktop: profiled Open Compute · red signal</text>

  <text x="900" y="978" text-anchor="middle" class="footnote">Every path ends the same way: visible offer → human click → observed verification.</text>
  <text x="900" y="1012" text-anchor="middle" class="footnote">Source-backed component view · design/architecture-overview.svg · 2026-09-03</text>
</svg>
