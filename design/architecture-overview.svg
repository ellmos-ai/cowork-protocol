<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" role="img" aria-labelledby="title description">
  <title id="title">Cowork Protocol architecture overview</title>
  <desc id="description">A human and preferred model collaborate through the Cowork Panel and Protocol Core. The runtime selects native Cowork, a bounded WebMCP bridge, or the default-off Browser Companion for pages without WebMCP. Human clicks authorize changes and applications return verified receipts.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8ef"/>
      <stop offset="0.48" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#eafbf7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#392b1f" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#352c26"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#07877e"/>
    </marker>
    <style>
      .title { font: 800 58px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #211a16; letter-spacing: -1.8px; }
      .subtitle { font: 400 25px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #584c43; }
      .eyebrow { font: 800 17px ui-monospace, "SFMono-Regular", Consolas, monospace; letter-spacing: 2.5px; fill: #087d75; }
      .card-title { font: 750 29px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #211a16; }
      .card-copy { font: 400 19px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #5d5047; }
      .lane-title { font: 800 24px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #211a16; }
      .lane-copy { font: 500 17px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #5d5047; }
      .chip { font: 800 15px ui-monospace, "SFMono-Regular", Consolas, monospace; letter-spacing: 0.7px; }
      .connector-label { font: 700 15px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #64564c; }
    </style>
  </defs>

  <rect width="1800" height="1050" rx="34" fill="url(#background)"/>
  <circle cx="1640" cy="105" r="210" fill="#23d2c1" opacity="0.10"/>
  <circle cx="135" cy="980" r="250" fill="#ff6b57" opacity="0.08"/>

  <text x="90" y="86" class="eyebrow">WEBMCP COLLABORATION ARCHITECTURE</text>
  <text x="90" y="153" class="title">Cowork Protocol</text>
  <text x="90" y="194" class="subtitle">A reusable working agreement between people, models and web applications.</text>

  <g transform="translate(1220 74)">
    <rect x="0" y="0" width="112" height="40" rx="20" fill="#eaf4ff" stroke="#75a7f2" stroke-width="2"/>
    <text x="56" y="26" text-anchor="middle" class="chip" fill="#245aa8">POINT</text>
    <rect x="124" y="0" width="112" height="40" rx="20" fill="#fff5dc" stroke="#e0b44d" stroke-width="2"/>
    <text x="180" y="26" text-anchor="middle" class="chip" fill="#8b6110">OFFER</text>
    <rect x="248" y="0" width="112" height="40" rx="20" fill="#fff0ed" stroke="#ff8d7d" stroke-width="2"/>
    <text x="304" y="26" text-anchor="middle" class="chip" fill="#b62f1e">CLICK</text>
    <rect x="372" y="0" width="112" height="40" rx="20" fill="#e9fbf2" stroke="#5fd5a2" stroke-width="2"/>
    <text x="428" y="26" text-anchor="middle" class="chip" fill="#087653">VERIFY</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="90" y="250" width="300" height="190" rx="24" fill="#fffefb" stroke="#decfbf" stroke-width="2"/>
    <rect x="430" y="250" width="300" height="190" rx="24" fill="#fffefb" stroke="#17aa9f" stroke-width="4"/>
    <rect x="770" y="250" width="340" height="190" rx="24" fill="#fffefb" stroke="#d8ab43" stroke-width="4"/>
    <rect x="1150" y="250" width="330" height="190" rx="24" fill="#fffefb" stroke="#e95b47" stroke-width="3"/>
    <rect x="1520" y="250" width="190" height="190" rx="24" fill="#fffefb" stroke="#8c9ead" stroke-width="2"/>
  </g>

  <text x="120" y="290" class="eyebrow">HUMAN</text>
  <text x="120" y="334" class="card-title">Intent and presence</text>
  <text x="120" y="370" class="card-copy">focus · speech · selection</text>
  <text x="120" y="400" class="card-copy">trusted click · evaluation</text>

  <text x="460" y="290" class="eyebrow">CONTROL SURFACE</text>
  <text x="460" y="334" class="card-title">Cowork Panel</text>
  <text x="460" y="370" class="card-copy">modes · offers · feedback</text>
  <text x="460" y="400" class="card-copy">presence · verified receipts</text>

  <text x="800" y="290" class="eyebrow">VERSIONED CONTRACT</text>
  <text x="800" y="334" class="card-title">Protocol Core</text>
  <text x="800" y="370" class="card-copy">bounded context · rights · leases</text>
  <text x="800" y="400" class="card-copy">causal events · latest-only state</text>

  <text x="1180" y="290" class="eyebrow">AGENT RUNTIME</text>
  <text x="1180" y="334" class="card-title">Preferred model</text>
  <text x="1180" y="370" class="card-copy">hypothesis · context request</text>
  <text x="1180" y="400" class="card-copy">proposal · scoped work</text>

  <text x="1550" y="290" class="eyebrow">OPTIONAL</text>
  <text x="1550" y="334" class="card-title">Model host</text>
  <text x="1550" y="370" class="card-copy">provider seam</text>
  <text x="1550" y="400" class="card-copy">no browser key</text>

  <path d="M390 345 H430" stroke="#352c26" stroke-width="3" marker-end="url(#arrow-dark)"/>
  <text x="410" y="236" text-anchor="middle" class="connector-label">authorize / evaluate</text>
  <path d="M730 345 H770" stroke="#352c26" stroke-width="3" marker-end="url(#arrow-dark)"/>
  <text x="750" y="236" text-anchor="middle" class="connector-label">events</text>
  <path d="M1110 329 H1150" stroke="#352c26" stroke-width="3" marker-end="url(#arrow-dark)"/>
  <path d="M1150 366 H1110" stroke="#352c26" stroke-width="3" marker-end="url(#arrow-dark)"/>
  <text x="1130" y="236" text-anchor="middle" class="connector-label">focus ↔ proposal</text>
  <path d="M1480 345 H1520" stroke="#8c9ead" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow-dark)"/>
  <text x="1500" y="236" text-anchor="middle" class="connector-label">optional seam</text>

  <path d="M940 440 V510" stroke="#07877e" stroke-width="5" marker-end="url(#arrow-teal)"/>
  <rect x="740" y="470" width="400" height="44" rx="22" fill="#087f76"/>
  <text x="940" y="498" text-anchor="middle" class="chip" fill="#ffffff">STRONGEST AVAILABLE CONNECTOR</text>

  <rect x="70" y="520" width="1660" height="460" rx="30" fill="#ffffff" opacity="0.74" stroke="#ddcfbf" stroke-width="2"/>
  <text x="105" y="565" class="eyebrow">CONNECTOR BOUNDARY</text>
  <text x="105" y="597" class="subtitle">Native when available. Bridged when necessary.</text>

  <!-- Native lane -->
  <rect x="105" y="630" width="300" height="92" rx="20" fill="#eafaf6" stroke="#17aa9f" stroke-width="3"/>
  <text x="130" y="670" class="lane-title">1 · Native Cowork</text>
  <text x="130" y="700" class="lane-copy">strongest guarantees</text>
  <path d="M405 676 H500" stroke="#07877e" stroke-width="4" marker-end="url(#arrow-teal)"/>
  <rect x="500" y="630" width="470" height="92" rx="20" fill="#fffefb" stroke="#17aa9f" stroke-width="3"/>
  <text x="530" y="670" class="lane-title">Native WebMCP Connector</text>
  <text x="530" y="700" class="lane-copy">stable targets · verified application actions</text>
  <path d="M970 676 H1065" stroke="#07877e" stroke-width="4" marker-end="url(#arrow-teal)"/>
  <rect x="1065" y="630" width="600" height="92" rx="20" fill="#fff8df" stroke="#d8ab43" stroke-width="3"/>
  <text x="1095" y="670" class="lane-title">FormBuilder Showcase</text>
  <text x="1095" y="700" class="lane-copy">real field deltas · click causes · verified receipts</text>

  <!-- Existing WebMCP lane -->
  <rect x="105" y="748" width="300" height="92" rx="20" fill="#fff6df" stroke="#d8ab43" stroke-width="3"/>
  <text x="130" y="788" class="lane-title">2 · Existing WebMCP</text>
  <text x="130" y="818" class="lane-copy">host catalog supplied</text>
  <path d="M405 794 H500" stroke="#b8891d" stroke-width="4" marker-end="url(#arrow-dark)"/>
  <rect x="500" y="748" width="470" height="92" rx="20" fill="#fffefb" stroke="#d8ab43" stroke-width="3"/>
  <text x="530" y="788" class="lane-title">Bounded WebMCP Bridge</text>
  <text x="530" y="818" class="lane-copy">read results capped · mutations stay offer-only</text>
  <path d="M970 794 H1065" stroke="#b8891d" stroke-width="4" marker-end="url(#arrow-dark)"/>
  <rect x="1065" y="748" width="600" height="92" rx="20" fill="#fffefb" stroke="#d8ab43" stroke-width="3"/>
  <text x="1095" y="788" class="lane-title">WebMCP-enabled web app</text>
  <text x="1095" y="818" class="lane-copy">degraded guarantees are explicit, never hidden</text>

  <!-- No WebMCP lane -->
  <rect x="105" y="866" width="300" height="92" rx="20" fill="#fff0ed" stroke="#e95b47" stroke-width="3"/>
  <text x="130" y="906" class="lane-title">3 · No WebMCP</text>
  <text x="130" y="936" class="lane-copy">extension starts disabled</text>
  <path d="M405 912 H500" stroke="#da3824" stroke-width="4" marker-end="url(#arrow-dark)"/>
  <rect x="500" y="866" width="470" height="92" rx="20" fill="#fffefb" stroke="#e95b47" stroke-width="3"/>
  <text x="530" y="906" class="lane-title">Browser Companion</text>
  <text x="530" y="936" class="lane-copy">350 → 1,200 → 400×400 one-shot · trusted click</text>
  <path d="M970 912 H1065" stroke="#da3824" stroke-width="4" marker-end="url(#arrow-dark)"/>
  <rect x="1065" y="866" width="600" height="92" rx="20" fill="#fffefb" stroke="#e95b47" stroke-width="3"/>
  <text x="1095" y="906" class="lane-title">Arbitrary web page</text>
  <text x="1095" y="936" class="lane-copy">visible offer → human click → observed verification</text>

  <text x="900" y="1020" text-anchor="middle" class="connector-label">Context stays bounded. Offers stay inert. Human authority stays visible.</text>
</svg>
