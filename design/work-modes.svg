  <text x="60" y="58" class="eyebrow on-art-soft">WORK MODE MATRIX</text>
  <text x="60" y="106" class="title on-art">Who acts, who advises</text>
  <text x="60" y="142" class="subtitle on-art-soft">Three questions per partner. The mode is only a name for the answers.</text>

  <!-- Column headers: the model -->
  <text x="356" y="196" class="eyebrow on-art-soft">MODEL</text>
  <text x="356" y="228" class="axis on-art">here · executing</text>
  <text x="356" y="250" class="axis-sub on-art-soft">inside a grant</text>
  <text x="756" y="228" class="axis on-art">here · advising</text>
  <text x="756" y="250" class="axis-sub on-art-soft">proposing, not clicking</text>
  <text x="1156" y="228" class="axis on-art">standby or away</text>
  <text x="1156" y="250" class="axis-sub on-art-soft">not working, or no seat</text>

  <!-- Row headers: the human -->
  <text x="60" y="196" class="eyebrow on-art-soft">HUMAN</text>
  <text x="60" y="306" class="axis on-art">here · executing</text>
  <text x="60" y="330" class="axis-sub on-art-soft">your hand on the mouse</text>
  <text x="60" y="444" class="axis on-art">here · advising</text>
  <text x="60" y="468" class="axis-sub on-art-soft">watching, directing</text>
  <text x="60" y="582" class="axis on-art">standby or away</text>
  <text x="60" y="606" class="axis-sub on-art-soft">stepped back or left</text>

  <!-- Row 1: human here, executing -->
  <rect x="356" y="264" width="384" height="124" rx="18" fill="#f4fbf9" stroke="#0a7a72" stroke-width="3"/>
  <text x="380" y="306" class="cell-title">Doubling</text>
  <text x="380" y="336" class="cell-copy">only when your areas differ · both click</text>
  <text x="380" y="362" class="cell-copy">same or unknown area → Sparring, you click</text>

  <rect x="756" y="264" width="384" height="124" rx="18" fill="#f4fbf9" stroke="#0a7a72" stroke-width="3"/>
  <text x="780" y="306" class="cell-title">Sparring</text>
  <text x="780" y="336" class="cell-copy">you execute, the model proposes</text>
  <text x="780" y="362" class="cell-copy">you hold the click right</text>

  <rect x="1156" y="264" width="384" height="124" rx="18" fill="#f4fbf9" stroke="#0a7a72" stroke-width="3"/>
  <text x="1180" y="306" class="cell-title">You work alone</text>
  <text x="1180" y="336" class="cell-copy">no model taking part</text>
  <text x="1180" y="362" class="cell-copy">you hold the click right</text>

  <!-- Row 2: human here, advising -->
  <rect x="356" y="402" width="384" height="124" rx="18" fill="#fffbef" stroke="#e5be6b" stroke-width="3"/>
  <text x="380" y="444" class="cell-title">Sparring</text>
  <text x="380" y="474" class="cell-copy">the model executes, you direct</text>
  <text x="380" y="500" class="cell-copy">the model holds the click right</text>

  <rect x="756" y="402" width="384" height="124" rx="18" fill="#fbf8f6" stroke="#c4b5a6" stroke-width="2"/>
  <text x="780" y="444" class="cell-title">Idle</text>
  <text x="780" y="474" class="cell-copy">both present, neither executing</text>
  <text x="780" y="500" class="cell-copy">nobody holds the click right</text>

  <rect x="1156" y="402" width="384" height="124" rx="18" fill="#fbf8f6" stroke="#c4b5a6" stroke-width="2"/>
  <text x="1180" y="444" class="cell-title">Idle</text>
  <text x="1180" y="474" class="cell-copy">you are here but not executing</text>
  <text x="1180" y="500" class="cell-copy">nobody holds the click right</text>

  <!-- Row 3: human standby or away -->
  <rect x="356" y="540" width="384" height="124" rx="18" fill="#fffbef" stroke="#e5be6b" stroke-width="3"/>
  <text x="380" y="582" class="cell-title">Model works alone</text>
  <text x="380" y="612" class="cell-copy">it finishes the granted job</text>
  <text x="380" y="638" class="cell-copy">the model holds the click right</text>

  <rect x="756" y="540" width="384" height="124" rx="18" fill="#fbf8f6" stroke="#c4b5a6" stroke-width="2"/>
  <text x="780" y="582" class="cell-title">Idle</text>
  <text x="780" y="612" class="cell-copy">nobody is executing</text>
  <text x="780" y="638" class="cell-copy">nobody holds the click right</text>

  <rect x="1156" y="540" width="384" height="124" rx="18" fill="#fbf8f6" stroke="#c4b5a6" stroke-width="2"/>
  <text x="1180" y="582" class="cell-title">Idle</text>
  <text x="1180" y="612" class="cell-copy">nobody is here</text>
  <text x="1180" y="638" class="cell-copy">nobody holds the click right</text>

  <!-- The journey -->
  <text x="60" y="708" class="eyebrow on-art-soft">THE USUAL JOURNEY · NOTHING IS CONFIGURED, EACH STEP CHANGES ONE ANSWER</text>

  <rect x="60" y="726" width="225" height="80" rx="16" fill="#fffefd" stroke="#d3c2ab" stroke-width="2"/>
  <text x="82" y="762" class="step-title">You type a job</text>
  <text x="82" y="786" class="step-copy">that mints the grant</text>
  <path d="M285 766 H311" stroke="#241c15" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="311" y="726" width="225" height="80" rx="16" fill="#fffefd" stroke="#e5be6b" stroke-width="2"/>
  <text x="333" y="762" class="step-title">Model executes</text>
  <text x="333" y="786" class="step-copy">Hand over, I'll watch</text>
  <path d="M536 766 H562" stroke="#241c15" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="562" y="726" width="225" height="80" rx="16" fill="#fffefd" stroke="#d3c2ab" stroke-width="2"/>
  <text x="584" y="762" class="step-title">You step away</text>
  <text x="584" y="786" class="step-copy">I'm briefly away</text>
  <path d="M787 766 H813" stroke="#241c15" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="813" y="726" width="225" height="80" rx="16" fill="#fffefd" stroke="#e5be6b" stroke-width="2"/>
  <text x="835" y="762" class="step-title">Model works alone</text>
  <text x="835" y="786" class="step-copy">inside that grant only</text>
  <path d="M1038 766 H1064" stroke="#241c15" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="1064" y="726" width="225" height="80" rx="16" fill="#fffefd" stroke="#d3c2ab" stroke-width="2"/>
  <text x="1086" y="762" class="step-title">You return</text>
  <text x="1086" y="786" class="step-copy">I'm back, or any click</text>
  <path d="M1289 766 H1315" stroke="#241c15" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="1315" y="726" width="225" height="80" rx="16" fill="#fffefd" stroke="#0a7a72" stroke-width="2"/>
  <text x="1337" y="762" class="step-title">You execute again</text>
  <text x="1337" y="786" class="step-copy">the model advises</text>

  <text x="60" y="848" class="rule on-art">A model executes only inside a grant or lease — presence is never a substitute.</text>
  <text x="60" y="876" class="footnote on-art-soft">Every cell resolved by resolveWorkMode() in packages/core · docs/work-modes.md · 2026-09-03</text>
</svg>
