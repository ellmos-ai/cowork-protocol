      <stop offset="0" stop-color="#fff0fa" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#fff0fa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#efe6ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#efe6ff" stop-opacity="0"/>
